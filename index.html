<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F5F0" />
    <style>
      /* 首帧关键样式：任何情况下先按当前主题画出背景，杜绝刷新闪屏/黑条 */
      :root {
        --bg: #f7f5f0;
      }
      [data-theme='dark'] {
        --bg: #1c1d26;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
      }
    </style>
    <script>
      // 首帧前同步主题，避免深色模式下白屏闪烁
      try {
        var t =
          localStorage.getItem('hourglass-theme') ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = t
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', t === 'dark' ? '#1C1D26' : '#F7F5F0')
      } catch (e) {}
    </script>
    <meta name="description" content="沙漏记事 — 离线可用的个性化日程与计时应用" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="沙漏记事" />
    <link rel="icon" type="image/png" href="./pwa-64x64.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon-180x180.png" />
    <title>沙漏记事</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
